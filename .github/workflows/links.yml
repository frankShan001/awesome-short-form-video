name: Links

on:
  pull_request:
  schedule:
    - cron: '17 9 1 * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Check links
        uses: lycheeverse/lychee-action@v2.9.0
        with:
          args: --no-progress --max-retries 3 --retry-wait-time 5 --timeout 30 --accept 200..=299,429 README.md CONTRIBUTING.md
          fail: true

  repos:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 22
      - name: Test the list format and the checker
        run: node test.mjs
      - name: Report archived or stale repositories
        run: node scripts/check-repos.mjs README.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
